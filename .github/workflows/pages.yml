name: Publish aecki’s catastrophe lab
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  regional-reference:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for the pinned regional model release
        id: reference
        run: python scripts/regional_reference_release.py inspect
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        if: steps.reference.outputs.exists != 'true'
        with:
          auto-activate-base: false
          activate-environment: ''
          miniforge-version: latest
      - name: Prepare the real historical reference once
        if: steps.reference.outputs.exists != 'true'
        shell: bash
        run: |
          python run.py setup
          python run.py regional-deps
          python run.py restore-history
          python run.py prepare-regional-models
          python scripts/regional_reference_release.py verify
      - name: Publish the verified immutable data artifact
        if: steps.reference.outputs.exists != 'true'
        run: |
          if ! gh release view "$REFERENCE_TAG" >/dev/null 2>&1; then
            gh release create "$REFERENCE_TAG" --target "$GITHUB_SHA" --prerelease --title "Regional rainfall model reference 1961–2025" --notes "Real MeteoSwiss RhiresD annual regional totals, wet-day counts and 1/3/5-day maxima, 1961–2025. Fixed Swiss footprints of at least 400 nominal square kilometres; only complete years. Source: MeteoSwiss; boundary © swisstopo. Manifest includes provider versions and source checksums."
          fi
          gh release upload "$REFERENCE_TAG" outputs/regional-models.tar.gz
  build:
    needs: regional-reference
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_enabled: ${{ steps.site.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          auto-activate-base: false
          activate-environment: ''
          miniforge-version: latest
      - name: Create repository-local environment and install frontend dependencies
        shell: bash
        run: python run.py setup
      - name: Install daily pipeline dependencies in the repository environment
        shell: bash
        run: python run.py regional-deps
      - name: Cache checksummed regional source files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/regional
          key: regional-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: regional-v1-${{ runner.os }}-
      - name: Cache the immutable historical reference
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/processed/regional-history
          key: regional-history-${{ hashFiles('config/regional-history.json') }}
      - name: Restore and verify the pinned historical reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python run.py restore-history
      - name: Cache the immutable regional modelling reference
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/processed/regional-models
          key: regional-models-${{ hashFiles('config/regional-models.json') }}
      - name: Restore regional annual maxima and source versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python run.py restore-regional-models
      - name: Prepare a complete daily regional release
        shell: bash
        run: python run.py fetch-regional --days 366
      - name: Test and build the static site
        shell: bash
        run: python run.py check
      - name: Check whether Pages is enabled
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "Static site built and tested. To publish, select Settings → Pages → GitHub Actions, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure Pages
        if: steps.site.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
