name: Publish aecki’s catastrophe lab
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_enabled: ${{ steps.site.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          auto-activate-base: false
          activate-environment: ''
          miniforge-version: latest
      - name: Create repository-local environment and install frontend dependencies
        shell: bash
        run: python run.py setup
      - name: Install daily pipeline dependencies in the repository environment
        shell: bash
        run: python run.py regional-deps
      - name: Cache checksummed regional source files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw/regional
          key: regional-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: regional-v1-${{ runner.os }}-
      - name: Prepare a complete daily regional release
        shell: bash
        run: python run.py fetch-regional --days 90
      - name: Test and build the static site
        shell: bash
        run: python run.py check
      - name: Check whether Pages is enabled
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "Static site built and tested. To publish, select Settings → Pages → GitHub Actions, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure Pages
        if: steps.site.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
