name: Cross-platform local app checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          auto-activate-base: false
          activate-environment: ''
          miniforge-version: latest
      - name: Create environment inside checkout
        shell: bash
        run: python run.py setup
      - name: Check the bundled snapshot and build offline app
        shell: bash
        run: python run.py check
      - name: Install optional tools inside the checkout
        shell: bash
        run: python run.py dev
      - name: Check Python and frontend quality
        shell: bash
        run: python run.py quality
