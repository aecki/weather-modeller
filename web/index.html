<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://wmts.geo.admin.ch; font-src 'self'; connect-src 'self' https://api3.geo.admin.ch https://data.geo.admin.ch https://data.bafu.admin.ch; worker-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta
      name="description"
      content="Explore real Swiss rainfall records, extreme rainfall models and lake levels, using MeteoSwiss and FOEN observations."
    />
    <title>aeckis rainfall explorer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="overview.css" />
    <script defer src="graphics.js"></script>
    <script defer src="data-core.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body data-mode="overview" data-analysis="address">
    <a class="skip-link" href="#workspace">Skip to content</a>
    <div class="utility-bar">
      <span>Swiss Precipitation Analysis</span><span>Observations · History · Models</span>
    </div>
    <header class="site-header">
      <a class="overview-brand" href="#overview"
        ><img src="favicon.svg" alt="" width="42" height="42" /><span
          >aeckis <b>rainfall explorer</b></span
        ></a
      >
      <span class="header-context">Rainfall and lake levels in Switzerland</span>
    </header>
    <nav class="primary-nav" aria-label="Display mode">
      <a href="#overview" id="overview-mode" aria-current="page">Overview</a
      ><a href="#pro" id="pro-mode">Pro Mode</a>
    </nav>
    <div class="app">
      <main id="workspace" tabindex="-1">
        <nav class="pro-only pro-nav" aria-label="Pro Mode sections">
          <a href="#pro">Address analysis</a><a href="#network">Stations &amp; gauges</a>
        </nav>
        <div id="regional-daily"></div>
        <div id="station-network" class="network-only pro-only"></div>
      </main>
    </div>
    <footer class="site-footer">
      <span>aeckis rainfall explorer</span
      ><span>Independent analysis · Sources: MeteoSwiss, FOEN · Map © swisstopo</span>
    </footer>
  </body>
</html>
